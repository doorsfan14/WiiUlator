<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">WiiUlator iPhone and iPad preview</title>
  <desc id="desc">A stylized iPad showing the WiiUlator game library, with an iPhone in front showing the WiiUlator game library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#cfd6df"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f5f7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity=".22"/>
    </filter>
    <clipPath id="ipadClip"><rect x="350" y="80" width="900" height="700" rx="55"/></clipPath>
    <clipPath id="iphoneClip"><rect x="100" y="260" width="390" height="620" rx="48"/></clipPath>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <ellipse cx="830" cy="805" rx="510" ry="55" fill="#000" opacity=".10"/>
  <ellipse cx="285" cy="875" rx="220" ry="30" fill="#000" opacity=".12"/>

  <!-- iPad behind -->
  <g filter="url(#shadow)">
    <rect x="330" y="60" width="940" height="740" rx="62" fill="#25272b"/>
    <rect x="350" y="80" width="900" height="700" rx="55" fill="url(#screen)"/>
    <circle cx="800" cy="94" r="5" fill="#111"/>
  </g>

  <g clip-path="url(#ipadClip)">
    <rect x="350" y="80" width="900" height="700" fill="#f7f7f8"/>
    <rect x="350" y="80" width="900" height="78" fill="#fff"/>
    <text x="395" y="130" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="38" font-weight="700" fill="#17181a">Library</text>
    <circle cx="1190" cy="118" r="22" fill="#eef0f3"/>
    <text x="1190" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#1677ff">+</text>

    <rect x="385" y="180" width="830" height="58" rx="15" fill="#e9eaed"/>
    <circle cx="415" cy="209" r="13" fill="none" stroke="#777" stroke-width="3"/>
    <line x1="425" y1="219" x2="435" y2="229" stroke="#777" stroke-width="3"/>
    <text x="450" y="220" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="22" fill="#777">Search games</text>

    <g transform="translate(390 270)">
      <rect width="800" height="155" rx="18" fill="#fff" stroke="#dedfe3"/>
      <rect x="22" y="22" width="112" height="112" rx="14" fill="#dfe8f6"/>
      <circle cx="78" cy="78" r="34" fill="#1b67c9" opacity=".9"/>
      <text x="78" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">8</text>
      <text x="160" y="61" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="28" font-weight="700" fill="#17181a">Mario Kart 8</text>
      <text x="160" y="94" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" fill="#666">Nintendo</text>
      <text x="160" y="122" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="18" fill="#888">Version 1.0</text>
      <text x="745" y="85" text-anchor="end" font-family="Arial,sans-serif" font-size="28" fill="#8b8e94">›</text>
    </g>

    <g transform="translate(390 445)">
      <rect width="800" height="155" rx="18" fill="#fff" stroke="#dedfe3"/>
      <rect x="22" y="22" width="112" height="112" rx="14" fill="#d8dce2"/>
      <circle cx="78" cy="78" r="30" fill="#777" opacity=".75"/>
      <text x="160" y="61" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="28" font-weight="700" fill="#17181a">Imported Game</text>
      <text x="160" y="94" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" fill="#666">Unknown</text>
      <text x="160" y="122" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="18" fill="#888">Ready for metadata</text>
      <text x="745" y="85" text-anchor="end" font-family="Arial,sans-serif" font-size="28" fill="#8b8e94">›</text>
    </g>

    <rect x="350" y="690" width="900" height="90" fill="#f7f7f8"/>
    <text x="395" y="744" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="19" fill="#777">Games: games</text>
    <text x="1200" y="744" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="19" fill="#777">2</text>
  </g>

  <!-- iPhone in front, overlapping iPad lower-left -->
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="450" height="690" rx="58" fill="#17191d"/>
    <rect x="90" y="250" width="410" height="650" rx="48" fill="url(#screen)"/>
    <rect x="215" y="265" width="160" height="34" rx="17" fill="#08090b"/>
  </g>

  <g clip-path="url(#iphoneClip)">
    <rect x="90" y="250" width="410" height="650" fill="#f7f7f8"/>
    <rect x="90" y="250" width="410" height="72" fill="#fff"/>
    <text x="120" y="297" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="30" font-weight="700" fill="#17181a">Library</text>
    <circle cx="465" cy="285" r="17" fill="#eef0f3"/>
    <text x="465" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#1677ff">+</text>

    <rect x="112" y="345" width="366" height="48" rx="13" fill="#e9eaed"/>
    <circle cx="137" cy="369" r="10" fill="none" stroke="#777" stroke-width="2"/>
    <line x1="145" y1="377" x2="152" y2="384" stroke="#777" stroke-width="2"/>
    <text x="165" y="376" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="17" fill="#777">Search games</text>

    <g transform="translate(112 420)">
      <rect width="366" height="120" rx="15" fill="#fff" stroke="#dedfe3"/>
      <rect x="14" y="14" width="92" height="92" rx="12" fill="#dfe8f6"/>
      <circle cx="60" cy="60" r="27" fill="#1b67c9"/>
      <text x="60" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">8</text>
      <text x="120" y="47" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="19" font-weight="700" fill="#17181a">Mario Kart 8</text>
      <text x="120" y="74" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="15" fill="#666">Nintendo</text>
      <text x="120" y="98" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" fill="#888">Version 1.0</text>
    </g>

    <g transform="translate(112 555)">
      <rect width="366" height="120" rx="15" fill="#fff" stroke="#dedfe3"/>
      <rect x="14" y="14" width="92" height="92" rx="12" fill="#d8dce2"/>
      <circle cx="60" cy="60" r="24" fill="#777" opacity=".75"/>
      <text x="120" y="47" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="19" font-weight="700" fill="#17181a">Imported Game</text>
      <text x="120" y="74" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="15" fill="#666">Unknown</text>
      <text x="120" y="98" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" fill="#888">Ready for metadata</text>
    </g>

    <rect x="90" y="820" width="410" height="80" fill="#f7f7f8"/>
    <text x="120" y="860" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="15" fill="#777">Games: games</text>
    <text x="470" y="860" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="15" fill="#777">2</text>
  </g>

  <text x="800" y="850" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="22" font-weight="600" fill="#555">WiiUlator • iOS &amp; iPadOS</text>
</svg>