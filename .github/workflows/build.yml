name: WiiUlator Nightly 1.0

on:
  push:
    branches:
      - main
      - nightly
  workflow_dispatch:

jobs:
  build:
    name: Build WiiUlator IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build WiiUlator
        run: |
          xcodebuild \
            -project WiiUlator.xcodeproj \
            -scheme WiiUlator \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload

          APP_PATH="$(find build -type d -name 'WiiUlator.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "WiiUlator.app was not found."
            exit 1
          fi

          cp -R "$APP_PATH" Payload/WiiUlator.app

          zip -r wiiulator-ios.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wiiulator-ios
          path: wiiulator-ios.ipa
          if-no-files-found: error
